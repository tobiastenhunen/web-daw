            <section class="effects-container">
                <div class="effect">
                    <h3>Filter</h3>
                    <div class="effect-setting">
                        <label for="effect-mix">Mix</label>
                        <webaudio-knob data-effect="filter" id="filter-mix" class="effect-mix-knob" name="effect-mix" min="0" max="1" value="0" step="0.001" diameter="40" colors="#fff; rgb(49, 49, 49); rgb(49, 49, 49)"></webaudio-knob>
                    </div>
                    <div class="effect-setting">
                        <label for="effect-param">Type</label>
                        <select data-effect="filter" data-param="type" class="effect-param" name="effect-param">
                            <option value="lowpass">lowpass</option>
                            <option value="highpass">highpass</option>
                            <option value="bandpass">bandpass</option>
                            <option value="lowshelf">lowshelf</option>
                            <option value="highshelf">highshelf</option>
                            <option value="notch">notch</option>
                            <option value="allpass">allpass</option>
                            <option value="peaking">peaking</option>
                        </select>
                    </div>
                    <div class="effect-setting">
                        <label for="effect-param">Freq</label>
                        <div class="effect-range-container">
                            <p>200hz</p>
                            <input type="range" data-effect="filter" data-param="frequency" class="effect-param effect-param-slider" name="filter-freq" min="200" max="10000" value="200"></input>
                            <p>10khz</p>
                        </div>
                    </div>
                </div>
                <div class="effect">
                    <h3>Distortion</h3>
                    <div class="effect-setting">
                        <label for="effect-mix">Mix</label>
                        <webaudio-knob data-effect="distortion" data-param="wet" class="effect-mix-knob" name="effect-mix" min="0" max="1" value="0" step="0.001" diameter="40" colors="#fff; rgb(49, 49, 49); rgb(49, 49, 49)"></webaudio-knob>
                    </div>
                    <div class="effect-setting">
                        <label for="effect-param">Lvl</label>
                        <webaudio-knob data-effect="distortion" data-param="distortion" class="effect-param" name="effect-param" min="0" max="1" value="0" step="0.001" diameter="40" colors="#fff; rgb(49, 49, 49); rgb(49, 49, 49)"></webaudio-knob>
                    </div>
                </div>
                <div class="effect">
                    <h3>Reverb</h3>
                    <div class="effect-setting">
                        <label for="effect-mix">Mix</label>
                        <webaudio-knob data-effect="reverb" data-param="wet" class="effect-mix-knob" name="effect-mix" min="0" max="1" value="0" step="0.001" diameter="40" colors="#fff; rgb(49, 49, 49); rgb(49, 49, 49)"></webaudio-knob>
                    </div>
                    <div class="effect-setting">
                        <label for="effect-param">Lvl</label>
                        <webaudio-knob data-effect="reverb" data-param="decay" class="effect-param" name="effect-param" min="0" max="10" value="0" step="0.001" diameter="40" colors="#fff; rgb(49, 49, 49); rgb(49, 49, 49)"></webaudio-knob>
                    </div>
                </div>
            </section>
        </div>
        <section class="instruments">
            <section class="piano-roll">
                <div id="piano-settings">
                    <div class="synth-setting">
                        <webaudio-knob id="mix-knob" name="mix-knob" min="-20" max="10" value="0" step="0.001" diameter="40" colors="#fff; rgb(49, 49, 49); rgb(49, 49, 49)"></webaudio-knob>
                        <label for="mix-knob">Mix</label>
                    </div>
                    <div class="synth-setting">
                        <webaudio-knob id="pan-knob" name="pan-knob" min="-1" max="1" value="0" step="0.001" diameter="40" colors="#fff; rgb(49, 49, 49); rgb(49, 49, 49)"></webaudio-knob>
                        <label for="pan-knob">Pan</label>
                    </div>
                    <div class="synth-setting">
                        <webaudio-knob id="attack-knob" name="attack-knob" min="0.002" max="10" value="0.002" step="0.001" diameter="40" colors="#fff; rgb(49, 49, 49); rgb(49, 49, 49)"></webaudio-knob>
                        <label for="attack-knob">Att</label>
                    </div>
                    <div class="synth-setting">
                        <webaudio-knob id="release-knob" name="release-knob" min="0.002" max="10" value="0.5" step="0.001" diameter="40" colors="#fff; rgb(49, 49, 49); rgb(49, 49, 49)"></webaudio-knob>
                        <label for="release-knob">Rel</label>
                    </div>
                    <div class="synth-setting">
                        <select id="shape-select" name="shape">
                            <option value="triangle">Triangle</option>
                            <option value="sine">Sine</option>
                            <option value="square">Square</option>
                            <option value="sawtooth">Sawtooth</option>
                        </select>
                        <label for="shape">Shape</label>
